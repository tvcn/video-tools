<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Five audio checks">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#3d6d8a"/>
<text x="54" y="58" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">AUDIO</text>
<text x="1226" y="58" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TECHNICAL PLATE / AUDIO</text>
<text x="54" y="206" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700">Check</text><text x="354" y="206" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700">Pass line</text><text x="714" y="206" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700">Log</text><line x1="54" y1="224" x2="1174" y2="224" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="238" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:14px;line-height:1.5;color:#171513">Noise floor</div></foreignObject><foreignObject x="354" y="238" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:14px;line-height:1.5;color:#171513">Acceptable in quiet room</div></foreignObject><foreignObject x="714" y="238" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:14px;line-height:1.5;color:#171513">30 sec at 50% gain</div></foreignObject><line x1="54" y1="302" x2="1174" y2="302" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="316" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:14px;line-height:1.5;color:#171513">Max SPL</div></foreignObject><foreignObject x="354" y="316" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:14px;line-height:1.5;color:#171513">No clipping on loud voice</div></foreignObject><foreignObject x="714" y="316" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:14px;line-height:1.5;color:#171513">Close shout</div></foreignObject><line x1="54" y1="380" x2="1174" y2="380" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="394" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:14px;line-height:1.5;color:#171513">Off-axis</div></foreignObject><foreignObject x="354" y="394" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:14px;line-height:1.5;color:#171513">Not hollow at side</div></foreignObject><foreignObject x="714" y="394" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:14px;line-height:1.5;color:#171513">30° test</div></foreignObject><line x1="54" y1="458" x2="1174" y2="458" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="472" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:14px;line-height:1.5;color:#171513">Handling</div></foreignObject><foreignObject x="354" y="472" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:14px;line-height:1.5;color:#171513">Rub/line noise controlled</div></foreignObject><foreignObject x="714" y="472" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:14px;line-height:1.5;color:#171513">Handheld walk</div></foreignObject><foreignObject x="54" y="610" width="1120" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:13px;line-height:1.5;color:#6f675d">Diagram: noise floor, max SPL, off-axis, handling, and power decide whether a mic can enter a project.</div></foreignObject>
