<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Buying a Light Kit: Soft Before Bright">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#3d6d8a"/>
<text x="54" y="58" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">LIGHT KIT</text>
<text x="1226" y="58" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TOOLS / BUYING &amp; FIXES</text>
<text x="54" y="142" fill="#171513" font-family="ui-sans-serif,Segoe UI,system-ui,sans-serif" font-size="38" font-weight="700">Buying a Light Kit: Soft Before</text>
<text x="54" y="196" fill="#171513" font-family="ui-sans-serif,Segoe UI,system-ui,sans-serif" font-size="38" font-weight="700">Bright</text>
<foreignObject x="54" y="298" width="760" height="190">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:17px;line-height:1.75;color:#6f675d">The first light kit is not the brightest; it is the easiest to control skin and shadow. Soft area, consistent color, and dimmability matter more than peak output.</div>
</foreignObject>
<rect x="900" y="170" width="326" height="340" rx="14" fill="#3d6d8a" fill-opacity=".08" stroke="#3d6d8a" stroke-opacity=".25"/>
<text x="930" y="212" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="2">Make the face work before the mood.</text>
<line x1="930" y1="232" x2="1196" y2="232" stroke="#3d6d8a" stroke-opacity=".3"/>
<rect x="54" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="68" y="593" fill="#6f675d" font-family="ui-sans-serif,Segoe UI,system-ui,sans-serif" font-size="13">Softness</text> <rect x="244" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="258" y="593" fill="#6f675d" font-family="ui-sans-serif,Segoe UI,system-ui,sans-serif" font-size="13">Color temp</text> <rect x="434" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="448" y="593" fill="#6f675d" font-family="ui-sans-serif,Segoe UI,system-ui,sans-serif" font-size="13">Control</text>

