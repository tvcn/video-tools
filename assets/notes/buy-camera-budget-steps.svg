gnObject x="54" y="394" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">自动对焦</div></foreignObject><foreignObject x="354" y="394" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">人眼/物体不呼吸</div></foreignObject><foreignObject x="714" y="394" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">暗光测试</div></foreignObject><line x1="54" y1="458" x2="1174" y2="458" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="472" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">电池</div></foreignObject><foreignObject x="354" y="472" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">实际 90 分钟以上</div></foreignObject><foreignObject x="714" y="472" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">原厂/副厂</div></foreignObject><foreignObject x="54" y="610" width="1120" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.5;color:#6f675d">示意：五项通过线比参数表更能决定一台机器能不能接活。</div></foreignObject>
