<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="7 天第一条片：每天只做一件">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#bf4f2a"/>
<text x="54" y="58" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">TVCN / PATH / 7 DAYS</text>
<text x="54" y="112" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700">7 天第一条片：每天只做一件</text>
<text x="1226" y="112" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">MAIN / START</text>
<rect x="54" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="72" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 01</text>
<text x="72" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">定题</text>
<text x="72" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">一句 logline</text>
<foreignObject x="72" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">谁想要什么，被什么挡住；不超过 40 字。</div>
</foreignObject>
<rect x="220" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="238" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 02</text>
<text x="238" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">分镜</text>
<text x="238" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">8 格镜头表</text>
<foreignObject x="238" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">景别、画面、动作、台词、时长。</div>
</foreignObject>
<rect x="386" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="404" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 03</text>
<text x="404" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">备机</text>
<text x="404" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">手机就够</text>
<foreignObject x="404" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">固定 + 窗边光；先不要买设备。</div>
</foreignObject>
<rect x="552" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="570" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 04</text>
<text x="570" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">开拍</text>
<text x="570" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">先拍最难的</text>
<foreignObject x="570" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">动作、情绪、关键台词，先拿下。</div>
</foreignObject>
<rect x="718" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="736" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 05</text>
<text x="736" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">补齐</text>
<text x="736" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">空镜与环境声</text>
<foreignObject x="736" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">手部、门口、房间底噪；每镜留保底。</div>
</foreignObject>
<rect x="884" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="902" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 06</text>
<text x="902" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">粗剪</text>
<text x="902" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">先让人看懂</text>
<foreignObject x="902" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">不加转场特效，先把声音修到能听清。</div>
</foreignObject>
<rect x="1050" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="1068" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 07</text>
<text x="1068" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">发布</text>
<text x="1068" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">导出与复盘</text>
<foreignObject x="1068" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">1080p 导出，写 3 条下次要改的事。</div>
</foreignObject>
<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
<text x="54" y="686" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TVCN / LOCAL PATH DIAGRAM</text>
<text x="1226" y="686" text-anchor="end" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12">每天只做一件，第七天必须交片</text>
</svg>