<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="First film in seven days: one job per day">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#bf4f2a"/>
<text x="54" y="58" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">TVCN / PATH / 7 DAYS</text>
<text x="54" y="112" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700">First film in seven days: one job per day</text>
<text x="1226" y="112" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">MAIN / START</text>
<rect x="54" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="72" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 01</text>
<text x="72" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">IDEA</text>
<text x="72" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">One logline</text>
<foreignObject x="72" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">Who wants what, blocked by what. 40 words max.</div>
</foreignObject>
<rect x="220" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="238" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 02</text>
<text x="238" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">BOARD</text>
<text x="238" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">Eight shots</text>
<foreignObject x="238" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">Size, frame, action, line, duration.</div>
</foreignObject>
<rect x="386" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="404" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 03</text>
<text x="404" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">PACK</text>
<text x="404" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">Phone is enough</text>
<foreignObject x="404" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">Mount and window light. Buy nothing yet.</div>
</foreignObject>
<rect x="552" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="570" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 04</text>
<text x="570" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">SHOOT</text>
<text x="570" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">Hardest first</text>
<foreignObject x="570" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">Action, emotion, key line. Get them first.</div>
</foreignObject>
<rect x="718" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="736" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 05</text>
<text x="736" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">COVER</text>
<text x="736" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">Inserts and tone</text>
<foreignObject x="736" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">Hands, doorway, room tone. Keep one safe take.</div>
</foreignObject>
<rect x="884" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="902" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 06</text>
<text x="902" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">CUT</text>
<text x="902" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">Make it clear</text>
<foreignObject x="902" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">No effects. Fix the sound until it is clear.</div>
</foreignObject>
<rect x="1050" y="184" width="150" height="386" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/>
<text x="1068" y="224" fill="#bf4f2a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">DAY 07</text>
<text x="1068" y="266" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14">SHIP</text>
<text x="1068" y="316" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700">Export and review</text>
<foreignObject x="1068" y="340" width="116" height="200">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;line-height:1.65;color:#6f675d">Export 1080p. Write three things to change.</div>
</foreignObject>
<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
<text x="54" y="686" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TVCN / LOCAL PATH DIAGRAM</text>
<text x="1226" y="686" text-anchor="end" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12">One job per day. Ship on day seven.</text>
</svg>