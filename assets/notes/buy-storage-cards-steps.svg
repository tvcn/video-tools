bject x="54" y="394" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">容量</div></foreignObject><foreignObject x="354" y="394" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">单机位 1–2 小时</div></foreignObject><foreignObject x="714" y="394" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">码率计算</div></foreignObject><line x1="54" y1="458" x2="1174" y2="458" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="472" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">发热</div></foreignObject><foreignObject x="354" y="472" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">连续录制不报警</div></foreignObject><foreignObject x="714" y="472" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">30 分钟</div></foreignObject><foreignObject x="54" y="610" width="1120" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.5;color:#6f675d">示意：VPG、持续写入、容量、发热、恢复，五项决定一张卡能不能上项目。</div></foreignObject>
