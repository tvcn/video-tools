<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="HDR chain: capture—monitor—grade—deliver">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#8d6a3f"/>
<text x="54" y="58" fill="#8d6a3f" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">HDR</text>
<text x="1226" y="58" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TECHNICAL PLATE / HDR</text>
<line x1="54" y1="358" x2="1174" y2="358" stroke="#8d6a3f" stroke-width="2"/><circle cx="54.0" cy="358" r="7" fill="#8d6a3f"/>
<text x="54.0" y="328" text-anchor="middle" fill="#171513" font-family="ui-monospace,Consolas,monospace" font-size="12">Capture Log/RAW</text><circle cx="278.0" cy="358" r="7" fill="#8d6a3f"/>
<text x="278.0" y="388" text-anchor="middle" fill="#171513" font-family="ui-monospace,Consolas,monospace" font-size="12">On-set monitor</text><circle cx="502.0" cy="358" r="7" fill="#8d6a3f"/>
<text x="502.0" y="328" text-anchor="middle" fill="#171513" font-family="ui-monospace,Consolas,monospace" font-size="12">Edit</text><circle cx="726.0" cy="358" r="7" fill="#8d6a3f"/>
<text x="726.0" y="388" text-anchor="middle" fill="#171513" font-family="ui-monospace,Consolas,monospace" font-size="12">HDR grade</text><circle cx="950.0" cy="358" r="7" fill="#8d6a3f"/>
<text x="950.0" y="328" text-anchor="middle" fill="#171513" font-family="ui-monospace,Consolas,monospace" font-size="12">SDR version</text><circle cx="1174.0" cy="358" r="7" fill="#8d6a3f"/>
<text x="1174.0" y="388" text-anchor="middle" fill="#171513" font-family="ui-monospace,Consolas,monospace" font-size="12">Delivery</text><foreignObject x="54" y="470" width="1120" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:15px;line-height:1.7;color:#6f675d"></div></foreignObject><foreignObject x="54" y="610" width="1120" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:13px;line-height:1.5;color:#6f675d">Diagram: every HDR stage needs a luminance anchor. Brightening the master at the end destroys highlights and skin together.</div></foreignObject>
<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
<text x="54" y="686" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TVCN / TECHNICAL DIAGRAM</text>
<text x="1226" y="686" text-anchor="end" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12">Diagram, not a set record</text>
</svg>