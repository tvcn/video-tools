<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="LED 虚拟拍摄：墙、跟踪、同步与色温">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#2f6f6a"/>
<text x="54" y="58" fill="#2f6f6a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">VIRTUAL PRODUCTION</text>
<text x="1226" y="58" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">SHOOTING / VIRTUAL PRODUCTION</text>
<text x="54" y="142" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="44" font-weight="700">LED 虚拟拍摄：墙、跟踪、同步</text>
<text x="54" y="196" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="44" font-weight="700">与色温</text>
<foreignObject x="54" y="298" width="760" height="190">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:17px;line-height:1.75;color:#6f675d">LED 虚拟拍摄不是“背景换成屏幕”。它把真实光影、相机跟踪、屏幕刷新和后期色彩绑成一条链；任何一项没锁，演员脸上的光就会和背景分开。</div>
</foreignObject>
<rect x="900" y="170" width="326" height="340" rx="14" fill="#2f6f6a" fill-opacity=".08" stroke="#2f6f6a" stroke-opacity=".25"/>
<text x="930" y="212" fill="#2f6f6a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="2">屏幕是灯，不是背景。</text>
<line x1="930" y1="232" x2="1196" y2="232" stroke="#2f6f6a" stroke-opacity=".3"/>
<rect x="54" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="68" y="593" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13">LED 墙</text> <rect x="244" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="258" y="593" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13">跟踪</text> <rect x="434" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="448" y="593" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13">色彩</text>

<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
<text x="54" y="686" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TVCN / WORKFLOW PLATE</text>
<text x="1226" y="686" text-anchor="end" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12">先测延迟，再拍演员。</text>
</svg>