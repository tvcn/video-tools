<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="现场录音机：通道、32 位浮点与时码">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#3d6d8a"/>
<text x="54" y="58" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">FIELD RECORDER</text>
<text x="1226" y="58" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TOOLS / BUYING &amp; FIXES</text>
<text x="54" y="142" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="44" font-weight="700">现场录音机：通道、32 位浮点与</text>
<text x="54" y="196" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="44" font-weight="700">时码</text>
<foreignObject x="54" y="298" width="760" height="190">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:17px;line-height:1.75;color:#6f675d">现场录音机的核心不是“能录几轨”，而是“断了一个通道还有没有备份、增益错了能不能救、后期能不能对时码”。</div>
</foreignObject>
<rect x="900" y="170" width="326" height="340" rx="14" fill="#3d6d8a" fill-opacity=".08" stroke="#3d6d8a" stroke-opacity=".25"/>
<text x="930" y="212" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="2">多一轨，不如多一个安全。</text>
<line x1="930" y1="232" x2="1196" y2="232" stroke="#3d6d8a" stroke-opacity=".3"/>
<rect x="54" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="68" y="593" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13">32-bit</text> <rect x="244" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="258" y="593" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13">时码</text> <rect x="434" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="448" y="593" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13">备份轨</text>

<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
<text x="54" y="686" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TVCN / WORKFLOW PLATE</text>
<text x="1226" y="686" text-anchor="end" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12">先录备份，再录主轨。</text>
</svg>