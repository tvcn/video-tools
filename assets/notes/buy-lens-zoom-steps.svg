<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="变焦五项检查">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#3d6d8a"/>
<text x="54" y="58" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">ZOOM</text>
<text x="1226" y="58" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TECHNICAL PLATE / ZOOM</text>
<text x="54" y="206" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700">检查项</text><text x="354" y="206" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700">通过线</text><text x="714" y="206" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700">记录</text><line x1="54" y1="224" x2="1174" y2="224" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="238" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">齐焦</div></foreignObject><foreignObject x="354" y="238" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">推拉后焦点不跑</div></foreignObject><foreignObject x="714" y="238" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">长焦端对焦再拉广</div></foreignObject><line x1="54" y1="302" x2="1174" y2="302" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="316" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">呼吸</div></foreignObject><foreignObject x="354" y="316" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">构图缩放可接受</div></foreignObject><foreignObject x="714" y="316" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">近距推拉</div></foreignObject><line x1="54" y1="380" x2="1174" y2="380" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="394" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">伺服</div></foreignObject><foreignObject x="354" y="394" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">变焦速度可调、不吵</div></foreignObject><foreignObject x="714" y="394" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">录音测试</div></foreignObject><line x1="54" y1="458" x2="1174" y2="458" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="472" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">重量</div></foreignObject><foreignObject x="354" y="472" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">手持 5 分钟不抖</div></foreignObject><foreignObject x="714" y="472" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">上机称重</div></foreignObject><foreignObject x="54" y="610" width="1120" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.5;color:#6f675d">示意：齐焦、呼吸、伺服、重量、滤镜，五项决定它能否在真实拍摄中省时间。</div></foreignObject>
<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
<text x="54" y="686" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TVCN / TECHNICAL DIAGRAM</text>
<text x="1226" y="686" text-anchor="end" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12">示意图，不是现场记录</text>
</svg>