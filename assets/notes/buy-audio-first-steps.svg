<text x="1226" y="58" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TECHNICAL PLATE / AUDIO</text>
<text x="54" y="206" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700">检查项</text><text x="354" y="206" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700">通过线</text><text x="714" y="206" fill="#3d6d8a" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700">记录</text><line x1="54" y1="224" x2="1174" y2="224" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="238" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">底噪</div></foreignObject><foreignObject x="354" y="238" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">安静房间可接受</div></foreignObject><foreignObject x="714" y="238" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">增益 50% 录 30 秒</div></foreignObject><line x1="54" y1="302" x2="1174" y2="302" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="316" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">最大声压</div></foreignObject><foreignObject x="354" y="316" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">大声不削波</div></foreignObject><foreignObject x="714" y="316" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">近距离喊话</div></foreignObject><line x1="54" y1="380" x2="1174" y2="380" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="394" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">离轴</div></foreignObject><foreignObject x="354" y="394" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">侧后方不空</div></foreignObject><foreignObject x="714" y="394" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">30° 测试</div></foreignObject><line x1="54" y1="458" x2="1174" y2="458" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="472" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">手持</div></foreignObject><foreignObject x="354" y="472" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">摩擦/线噪可控</div></foreignObject><foreignObject x="714" y="472" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">手持走动</div></foreignObject><foreignObject x="54" y="610" width="1120" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.5;color:#6f675d">示意：底噪、最大声压、离轴、手持噪声、供电，五项决定一支麦能不能进项目。</div></foreignObject>
