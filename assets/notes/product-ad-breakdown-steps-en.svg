<text x="54" y="58" fill="#6f7d4a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">TVCN / WORKSHEET</text>
<text x="54" y="112" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700"><tspan x="54" dy="0">Product Ad Breakdown: Problem Becomes Proof</tspan></text>
<text x="1226" y="112" text-anchor="end" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Three variables before you watch</text>
<rect x="54" y="224" width="368" height="378" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/><text x="82" y="266" fill="#6f7d4a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">VARIABLE 01 / DURATION</text><text x="82" y="312" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600">Duration</text><text x="82" y="336" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">片长</text><text x="82" y="392" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700">60 sec</text><text x="82" y="420" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">60 秒</text><text x="82" y="462" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11"><tspan x="82" dy="0">Watch at the format&#x27;s usual length; do not judge</tspan><tspan x="82" dy="18">30 seconds by a 3-minute standard.</tspan></text><rect x="452" y="224" width="368" height="378" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/><text x="480" y="266" fill="#6f7d4a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">VARIABLE 02 / PLATFORM</text><text x="480" y="312" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600">Platform</text><text x="480" y="336" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">平台</text><text x="480" y="392" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700">Feed / Commerce</text><text x="480" y="420" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">信息流 / 电商</text><text x="480" y="462" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11"><tspan x="480" dy="0">Platform decides the first 3 seconds, captions,</tspan><tspan x="480" dy="18">ratio, and silent default.</tspan></text><rect x="850" y="224" width="368" height="378" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/><text x="878" y="266" fill="#6f7d4a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">VARIABLE 03 / GOAL</text><text x="878" y="312" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600">Goal</text><text x="878" y="336" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">目标</text><text x="878" y="392" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700">Finish / Remember / Buy</text><text x="878" y="420" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">看完 / 记住 / 下单</text><text x="878" y="462" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11"><tspan x="878" dy="0">Keep one goal; three goals mean none.</tspan></text>
<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
