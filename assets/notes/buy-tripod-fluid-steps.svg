 x="54" y="394" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">俯仰</div></foreignObject><foreignObject x="354" y="394" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">-70°~+90° 可用</div></foreignObject><foreignObject x="714" y="394" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">低/高机位</div></foreignObject><line x1="54" y1="458" x2="1174" y2="458" stroke="#171513" stroke-opacity=".12"/><foreignObject x="54" y="472" width="284" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">接口</div></foreignObject><foreignObject x="354" y="472" width="344" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">75/100mm 与脚架匹配</div></foreignObject><foreignObject x="714" y="472" width="444" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:14px;line-height:1.5;color:#171513">现场安装</div></foreignObject><foreignObject x="54" y="610" width="1120" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.5;color:#6f675d">示意：阻尼、平衡、俯仰范围、接口、重量，五项决定摇移是否顺。</div></foreignObject>
