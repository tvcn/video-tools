<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="三步流程">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#b06b3e"/>
<text x="54" y="58" fill="#b06b3e" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">TVCN / THREE STEPS / 138</text>
<text x="54" y="112" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700"><tspan x="54" dy="0">定格布景：尺度与透视线</tspan></text>
<text x="1226" y="112" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">STOP-MOTION</text>
<rect x="54" y="224" width="368" height="378" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/><text x="82" y="268" fill="#b06b3e" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700">STEP 01</text><circle cx="96" cy="316" r="23" fill="#b06b3e"/><text x="96" y="324" text-anchor="middle" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700">1</text><text x="82" y="376" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="600"><tspan x="82" dy="0">先让人偶站住、走一步。</tspan></text><text x="82" y="433" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15"><tspan x="82" dy="0">Make the puppet stand and take</tspan><tspan x="82" dy="21">one step.</tspan></text><rect x="452" y="224" width="368" height="378" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/><text x="480" y="268" fill="#b06b3e" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700">STEP 02</text><circle cx="494" cy="316" r="23" fill="#b06b3e"/><text x="494" y="324" text-anchor="middle" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700">2</text><text x="480" y="376" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="600"><tspan x="480" dy="0">再拍两遍做运动模糊。</tspan></text><text x="480" y="433" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15"><tspan x="480" dy="0">Shoot twice for motion blur.</tspan></text><rect x="850" y="224" width="368" height="378" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/><text x="878" y="268" fill="#b06b3e" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700">STEP 03</text><circle cx="892" cy="316" r="23" fill="#b06b3e"/><text x="892" y="324" text-anchor="middle" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700">3</text><text x="878" y="376" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="600"><tspan x="878" dy="0">最后按帧检查抖动。</tspan></text><text x="878" y="433" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15"><tspan x="878" dy="0">Check frame-to-frame jitter.</tspan></text>
<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
<text x="54" y="686" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TVCN / LOCAL FIELD NOTE</text>
<text x="1226" y="686" text-anchor="end" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12">三步做完，再回看画面</text>
</svg>