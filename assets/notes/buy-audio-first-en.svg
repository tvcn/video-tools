  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:ui-sans-serif,Segoe UI,system-ui,sans-serif;font-size:17px;line-height:1.75;color:#6f675d">Audiences forgive a plain image; they do not forgive unclear sound. On a limited budget, put money into a microphone and recorder before a second lens.</div>
