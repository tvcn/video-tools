<text x="1226" y="58" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TECHNICAL PLATE / CORPORATE</text>
<line x1="54" y1="358" x2="1174" y2="358" stroke="#6f7d4a" stroke-width="2"/><circle cx="54.0" cy="358" r="7" fill="#6f7d4a"/>
<text x="54.0" y="328" text-anchor="middle" fill="#171513" font-family="ui-monospace,Consolas,monospace" font-size="12">一个具体问题</text><circle cx="278.0" cy="358" r="7" fill="#6f7d4a"/>
<text x="278.0" y="388" text-anchor="middle" fill="#171513" font-family="ui-monospace,Consolas,monospace" font-size="12">一个人出场</text><circle cx="502.0" cy="358" r="7" fill="#6f7d4a"/>
<text x="502.0" y="328" text-anchor="middle" fill="#171513" font-family="ui-monospace,Consolas,monospace" font-size="12">旧办法失败</text><circle cx="726.0" cy="358" r="7" fill="#6f7d4a"/>
<text x="726.0" y="388" text-anchor="middle" fill="#171513" font-family="ui-monospace,Consolas,monospace" font-size="12">公司介入</text><circle cx="950.0" cy="358" r="7" fill="#6f7d4a"/>
<text x="950.0" y="328" text-anchor="middle" fill="#171513" font-family="ui-monospace,Consolas,monospace" font-size="12">可验证结果</text><circle cx="1174.0" cy="358" r="7" fill="#6f7d4a"/>
<text x="1174.0" y="388" text-anchor="middle" fill="#171513" font-family="ui-monospace,Consolas,monospace" font-size="12">一个下一步</text><foreignObject x="54" y="470" width="1120" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:15px;line-height:1.7;color:#6f675d">先把每一拍写成一句可拍的话，再开机。</div></foreignObject><foreignObject x="54" y="610" width="1120" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:13px;line-height:1.5;color:#6f675d">示意：六个拍点按顺序落地，缺一个就会变成素材堆。</div></foreignObject>
<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
