<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="器材与制作保险：保什么、不保什么">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#7a5a72"/>
<text x="54" y="58" fill="#7a5a72" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">INSURANCE</text>
<text x="1226" y="58" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">HISTORY &amp; LITERACY / LAW &amp; ETHICS</text>
<text x="54" y="142" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="44" font-weight="700">器材与制作保险：保什么、不保什么</text>
<foreignObject x="54" y="244" width="760" height="190">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:17px;line-height:1.75;color:#6f675d">设备险不是“坏了就赔”。要区分财产一切险、机器损坏险、公众责任险、货运险；免赔额、折旧、除外责任和理赔材料决定你能不能拿到钱。</div>
</foreignObject>
<rect x="900" y="170" width="326" height="340" rx="14" fill="#7a5a72" fill-opacity=".08" stroke="#7a5a72" stroke-opacity=".25"/>
<text x="930" y="212" fill="#7a5a72" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="2">保单不是万能，除外责任才是边界。</text>
<line x1="930" y1="232" x2="1196" y2="232" stroke="#7a5a72" stroke-opacity=".3"/>
<rect x="54" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="68" y="593" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13">器材</text> <rect x="244" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="258" y="593" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13">责任</text> <rect x="434" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="448" y="593" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13">理赔</text>

<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
<text x="54" y="686" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TVCN / WORKFLOW PLATE</text>
<text x="1226" y="686" text-anchor="end" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12">先看免赔，再看保额。</text>
</svg>