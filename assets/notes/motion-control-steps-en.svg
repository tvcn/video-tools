<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Three steps">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#5b5f9e"/>
<text x="54" y="58" fill="#5b5f9e" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">TVCN / THREE STEPS / 103</text>
<text x="54" y="112" fill="#171513" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="700"><tspan x="54" dy="0">Motion Control: Give the Camera a Route</tspan></text>
<text x="1226" y="112" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">GENERATION</text>
<rect x="54" y="224" width="368" height="378" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/><text x="82" y="268" fill="#5b5f9e" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700">STEP 01</text><circle cx="96" cy="316" r="23" fill="#5b5f9e"/><text x="96" y="324" text-anchor="middle" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700">1</text><text x="82" y="378" fill="#171513" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="600"><tspan x="82" dy="0">Write one shot, not a</tspan><tspan x="82" dy="25">sequence.</tspan></text><rect x="452" y="224" width="368" height="378" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/><text x="480" y="268" fill="#5b5f9e" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700">STEP 02</text><circle cx="494" cy="316" r="23" fill="#5b5f9e"/><text x="494" y="324" text-anchor="middle" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700">2</text><text x="480" y="378" fill="#171513" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="600"><tspan x="480" dy="0">Lock subject, action, space,</tspan><tspan x="480" dy="25">and camera.</tspan></text><rect x="850" y="224" width="368" height="378" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/><text x="878" y="268" fill="#5b5f9e" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700">STEP 03</text><circle cx="892" cy="316" r="23" fill="#5b5f9e"/><text x="892" y="324" text-anchor="middle" fill="#fff" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700">3</text><text x="878" y="378" fill="#171513" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="600"><tspan x="878" dy="0">Run three tests for</tspan><tspan x="878" dy="25">repeatability.</tspan></text>
<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
<text x="54" y="686" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TVCN / LOCAL FIELD NOTE</text>
<text x="1226" y="686" text-anchor="end" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Do all three, then look again</text>
</svg>