<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="MV 拉片：歌的结构怎么变成画面：拉片前三个变量">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#6f7d4a"/>
<text x="54" y="58" fill="#6f7d4a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">TVCN / WORKSHEET</text>
<text x="54" y="112" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700"><tspan x="54" dy="0">MV 拉片：歌的结构怎么变成画面</tspan></text>
<text x="1226" y="112" text-anchor="end" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">拉片前先定三个变量</text>
<rect x="54" y="224" width="368" height="378" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/><text x="82" y="266" fill="#6f7d4a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">变量 01 / 片长</text><text x="82" y="312" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600">片长</text><text x="82" y="336" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">DURATION</text><text x="82" y="392" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700">3–4 分钟</text><text x="82" y="420" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">3–4 min</text><text x="82" y="462" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12"><tspan x="82" dy="0">按片型常见时长看；不要拿 3 分钟的标准看 30</tspan><tspan x="82" dy="18">秒。</tspan></text><rect x="452" y="224" width="368" height="378" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/><text x="480" y="266" fill="#6f7d4a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">变量 02 / 平台</text><text x="480" y="312" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600">平台</text><text x="480" y="336" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">PLATFORM</text><text x="480" y="392" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700">音乐平台 / 视频号</text><text x="480" y="420" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Music platform / Channels</text><text x="480" y="462" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12"><tspan x="480" dy="0">平台决定前 3 秒、字幕、画幅和默认静音。</tspan></text><rect x="850" y="224" width="368" height="378" rx="12" fill="#fffdf8" stroke="#171513" stroke-opacity=".16"/><text x="878" y="266" fill="#6f7d4a" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700">变量 03 / 目标</text><text x="878" y="312" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600">目标</text><text x="878" y="336" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">GOAL</text><text x="878" y="392" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700">记住一个母题</text><text x="878" y="420" fill="#6f675d" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Remember one motif</text><text x="878" y="462" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12"><tspan x="878" dy="0">只留一个目标；三个都要，等于没有。</tspan></text>
<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
<text x="54" y="686" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TVCN / 拉片工作纸</text>
<text x="1226" y="686" text-anchor="end" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12">三个变量，先写下来</text>
</svg>
