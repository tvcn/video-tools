<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="归档与资产复用：让下一条片子更快">
<rect width="1280" height="720" fill="#f4f1eb"/>
<rect x="0" y="0" width="1280" height="8" fill="#8d6a3f"/>
<text x="54" y="58" fill="#8d6a3f" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">ARCHIVE / REUSE</text>
<text x="1226" y="58" text-anchor="end" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">POST / ASSETS</text>
<text x="54" y="142" fill="#171513" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="44" font-weight="700">归档与资产复用：让下一条片子更快</text>
<foreignObject x="54" y="244" width="760" height="190">
  <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Noto Sans SC,Microsoft YaHei,sans-serif;font-size:17px;line-height:1.75;color:#6f675d">归档不是把文件夹拖进硬盘。它要让下一个人能打开工程、找到素材、知道授权、恢复调色和声音；复用不是翻旧片，是有索引地取用。</div>
</foreignObject>
<rect x="900" y="170" width="326" height="340" rx="14" fill="#8d6a3f" fill-opacity=".08" stroke="#8d6a3f" stroke-opacity=".25"/>
<text x="930" y="212" fill="#8d6a3f" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="2">归档的验收，是别人能打开。</text>
<line x1="930" y1="232" x2="1196" y2="232" stroke="#8d6a3f" stroke-opacity=".3"/>
<rect x="54" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="68" y="593" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13">工程</text> <rect x="244" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="258" y="593" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13">授权</text> <rect x="434" y="566" width="170" height="44" rx="8" fill="#fffdf8" stroke="#171513" stroke-opacity=".14"/><text x="448" y="593" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13">索引</text>

<line x1="54" y1="654" x2="1226" y2="654" stroke="#171513" stroke-opacity=".14"/>
<text x="54" y="686" fill="#6f675d" font-family="ui-monospace,Consolas,monospace" font-size="12">TVCN / WORKFLOW PLATE</text>
<text x="1226" y="686" text-anchor="end" fill="#6f675d" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12">先恢复测试，再删源。</text>
</svg>